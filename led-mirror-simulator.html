<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Mirror Simulator</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;text-align:center;margin:0;padding:15px}
h2{margin:5px 0 15px}
.controls{background:#222;padding:15px;border-radius:15px;max-width:500px;margin:0 auto 20px}
.controls label{display:block;margin:10px 0 5px;text-align:left}
select,input{width:100%;padding:10px;border-radius:8px;border:none;font-size:16px}
.btn{margin-top:15px;background:#00c853;color:#fff;border:none;padding:12px;width:100%;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer}
.btn.off{background:#d50000}
.mirror-wrap{display:flex;justify-content:center}
#mirror{width:280px;height:380px;background:#c0c0c0;position:relative;overflow:hidden;border:10px solid #333;transition:0.3s;box-shadow:0 0 30px #fff}
#mirror.round{border-radius:50%;width:300px;height:300px}
#mirror.oval{border-radius:50%;width:280px;height:380px}
#mirror.arch{border-radius:140px 140px 10px 10px}
#camVideo{width:100%;height:100%;object-fit:cover;display:none;transform:scaleX(-1)}
#mirrorText{position:absolute;top:50%;left:0;width:100%;transform:translateY(-50%);color:#555;font-size:18px}
#ledGlow{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 40px #fff}
small{color:#aaa}
</style>
</head>
<body>
<h2>🪞 Live Mirror Simulator</h2>

<div class="controls">
<label>Mirror Shape / Shape Chunain:</label>
<select id="shape" onchange="changeShape()">
<option value="">Rectangle</option>
<option value="round">Round</option>
<option value="oval">Oval</option>
<option value="arch">Arch</option>
</select>

<label>LED Light Color:</label>
<select id="ledColor" onchange="changeLED()">
<option value="#ffffff">White</option>
<option value="#ffe082">Warm Yellow</option>
<option value="#80d8ff">Cool Blue</option>
<option value="#ff80ab">Pink</option>
</select>

<label>LED Brightness:</label>
<input type="range" id="brightness" min="0" max="100" value="70" oninput="changeLED()">

<button class="btn" id="camBtn" onclick="toggleCamera()">📸 Live Mirror ON - Apna Face Dekhen</button>
<small>Camera ON karne par mobile Allow puchega, Allow dabana hai.</small>
</div>

<div class="mirror-wrap">
<div id="mirror">
<video id="camVideo" autoplay playsinline muted></video>
<div id="mirrorText">Mirror Preview<br>Camera ON karein to apna face dekhen</div>
<div id="ledGlow"></div>
</div>
</div>
<p style="margin-top:20px"><a href="index.html" style="color:#fff">← Wapas Website Par Jayein</a></p>

<script>
let stream = null;
function changeShape(){
  let m = document.getElementById('mirror');
  m.className = '';
  m.id = 'mirror';
  let s = document.getElementById('shape').value;
  if(s) m.classList.add(s);
}
function changeLED(){
  let c = document.getElementById('ledColor').value;
  let b = document.getElementById('brightness').value;
  let glow = document.getElementById('ledGlow');
  let mirror = document.getElementById('mirror');
  glow.style.boxShadow = 'inset 0 0 40px ' + c;
  mirror.style.boxShadow = '0 0 ' + b + 'px ' + c;
  mirror.style.borderColor = c;
}
async function toggleCamera(){
  let video = document.getElementById('camVideo');
  let btn = document.getElementById('camBtn');
  let txt = document.getElementById('mirrorText');
  if(!stream){
    try{
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
      video.srcObject = stream;
      video.style.display = 'block';
      txt.style.display = 'none';
      btn.innerText = '❌ Live Mirror OFF';
      btn.classList.add('off');
    }catch(e){ alert('Camera Allow nahi hua. Dobara Allow dabayein.'); }
  } else {
    stream.getTracks().forEach(t=>t.stop());
    stream = null;
    video.style.display = 'none';
    txt.style.display = 'block';
    btn.innerText = '📸 Live Mirror ON - Apna Face Dekhen';
    btn.classList.remove('off');
  }
}
changeLED();
</script>
</body>
</html>
