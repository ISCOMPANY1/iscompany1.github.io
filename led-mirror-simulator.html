<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Versace LED Mirror</title>
<style>
body{background:#111;color:#fff;text-align:center;font-family:sans-serif;margin:0;padding:15px}
#box img{width:95%;max-width:420px;border-radius:50%;border:4px solid #fff}
button{padding:14px 20px;border:none;border-radius:12px;font-size:18px;margin:8px;width:90%;max-width:400px}
input{width:90%;max-width:400px}
</style>
</head>
<body>
<h2>✨ Versace LED Mirror ✨</h2>
<p>Versace Design Wala Mirror - Haath Hilao</p>

<img id="m" src="mirror.jpg" onerror="this.src='mirror.jpg?v=1'">

<p id="t">💡 Light: ON hai</p>
<p>Light Tez / Halki:</p>
<input type="range" min="30" max="120" value="100" oninput="document.getElementById('m').style.filter='brightness('+(this.value/100)+')'">

<br><button style="background:orange;color:#fff" onclick="toggle()">👋 Haath Hilao - Sensor ON / OFF</button><br>
<button onclick="document.body.style.background=document.body.style.background=='black'?'#111':'black'">🌙 Din / Raat</button><br>
<br><a href="index.html" style="color:#fff">← Wapas Website Par Jayein</a>

<script>
let on=true;
function toggle(){
  on=!on;
  let img=document.getElementById('m');
  img.style.filter=on?'brightness(1)':'brightness(0.2)';
  document.getElementById('t').innerText=on?'💡 Light: ON hai':'💡 Light: OFF hai';
}
document.getElementById('m').onclick=toggle;
</script>
</body>
</html>
