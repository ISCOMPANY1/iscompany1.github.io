<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensor + Room Mirror Simulator</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;text-align:center;margin:0;padding:12px}
h2{margin:5px 0 10px;font-size:22px}
.controls{background:#222;padding:14px;border-radius:15px;max-width:520px;margin:0 auto 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.pill{background:#333;color:#fff;border:2px solid #555;padding:9px 14px;border-radius:20px;cursor:pointer;font-size:14px}
.pill.active{background:#00c853;border-color:#00c853;font-weight:bold}
select{width:100%;padding:10px;border-radius:8px;border:none;font-size:16px;margin-top:5px}
input[type=range]{width:100%;margin:10px 0}
.sensorBtn{background:linear-gradient(45deg,#ff9800,#ff5722);color:#fff;border:none;padding:14px;width:100%;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:12px}
.sensorBtn:active{transform:scale(0.97)}
.dayNight{background:#fff;color:#000;margin-top:10px}
#room{max-width:520px;height:360px;margin:0 auto;border-radius:18px;position:relative;overflow:hidden;display:flex;justify-content:center;align-items:center;background:#8d6e63}
#mirror{width:210px;height:300px;background:#e0e0e0;position:relative;overflow:hidden;border:6px solid #fff;transition:0.3s;border-radius:10px;box-shadow:0 0 60px #fff}
#mirrorText{position:absolute;top:40%;left:0;width:100%;color:#555;font-size:15px;line-height:1.5}
#sensorDot{position:absolute;bottom:10px;right:10px;width:16px;height:16px;background:#00ff00;border-radius:50%;box-shadow:0 0 10px #00ff00;z-index:5}
#hand{font-size:50px;position:absolute;bottom:0;left:50%;transform:translateX(-50%);display:none;z-index:10}
#status{margin-top:10px;font-weight:bold}
</style>
</head>
<body>
<h2>🪞 Sensor + Room Mirror Simulator</h2>
<div class="controls">
<b>1. Kamra Chunain / Room:</b>
<div class="row">
<button class="pill active" id="btn-bedroom" onclick="setRoom('bedroom')">🛏️ Bedroom</button>
<button class="pill" id="btn-bathroom" onclick="setRoom('bathroom')">🛁 Bathroom</button>
<button class="pill" id="btn-salon" onclick="setRoom('salon')">💇 Salon</button>
<button class="pill" id="btn-living" onclick="setRoom('living')">🛋️ Living Room</button>
</div>

<b>2. Mirror Shape:</b>
<select id="shape" onchange="changeShape()">
<option value="rect">Rectangle</option>
<option value="round">Round</option>
<option value="oval">Oval</option>
<option value="arch">Arch</option>
</select>

<b>3. LED Color:</b>
<div class="row">
<button class="pill active" id="led-white" onclick="setLED('#ffffff','led-white')">White</button>
<button class="pill" id="led-warm" onclick="setLED('#ffe082','led-warm')">Warm Yellow</button>
<button class="pill" id="led-blue" onclick="setLED('#80d8ff','led-blue')">Cool Blue</button>
<button class="pill" id="led-pink" onclick="setLED('#ff80ab','led-pink')">Pink</button>
</div>

<b>4. LED Brightness:</b>
<input type="range" id="brightness" min="0" max="100" value="80" oninput="updateLED()">

<button class="sensorBtn" onclick="toggleSensor()">👋 Haath Hilao - Sensor ON / OFF</button>
<button class="sensorBtn dayNight" onclick="toggleNight()">🌙 Din / Raat - Raat Me Dekhen</button>
<div id="status">💡 Light: ON hai</div>
</div>

<div id="room">
<div id="mirror">
<div id="mirrorText">✨ LED Mirror<br><small>Sensor se Light ON / OFF karein</small></div>
<div id="sensorDot"></div>
<div id="hand">👋</div>
</div>
</div>
<p><a href="index.html" style="color:#fff">← Wapas Website Par Jayein</a></p>

<script>
var ledColor = '#ffffff';
var isOn = true;
var isNight = false;

function clearRoomButtons(){
  document.getElementById('btn-bedroom').classList.remove('active');
  document.getElementById('btn-bathroom').classList.remove('active');
  document.getElementById('btn-salon').classList.remove('active');
  document.getElementById('btn-living').classList.remove('active');
}
function setRoom(r){
  var room = document.getElementById('room');
  clearRoomButtons();
  if(r=='bedroom'){ room.style.background='#8d6e63'; document.getElementById('btn-bedroom').classList.add('active'); }
  if(r=='bathroom'){ room.style.background='#607d8b'; document.getElementById('btn-bathroom').classList.add('active'); }
  if(r=='salon'){ room.style.background='#ad1457'; document.getElementById('btn-salon').classList.add('active'); }
  if(r=='living'){ room.style.background='#2e7d32'; document.getElementById('btn-living').classList.add('active'); }
  if(isNight){ room.style.filter='brightness(0.35)'; }
}
function changeShape(){
  var m = document.getElementById('mirror');
  var s = document.getElementById('shape').value;
  if(s=='rect'){ m.style.borderRadius='10px'; m.style.width='210px'; m.style.height='300px'; }
  if(s=='round'){ m.style.borderRadius='50%'; m.style.width='260px'; m.style.height='260px'; }
  if(s=='oval'){ m.style.borderRadius='50%'; m.style.width='210px'; m.style.height='300px'; }
  if(s=='arch'){ m.style.borderRadius='110px 110px 8px 8px'; m.style.width='210px'; m.style.height='300px'; }
}
function setLED(c, id){
  ledColor = c;
  document.getElementById('led-white').classList.remove('active');
  document.getElementById('led-warm').classList.remove('active');
  document.getElementById('led-blue').classList.remove('active');
  document.getElementById('led-pink').classList.remove('active');
  document.getElementById(id).classList.add('active');
  updateLED();
}
function updateLED(){
  var b = document.getElementById('brightness').value;
  var mirror = document.getElementById('mirror');
  if(!isOn){ mirror.style.boxShadow='none'; mirror.style.borderColor='#333'; return; }
  mirror.style.boxShadow='0 0 '+b+'px '+ledColor;
  mirror.style.borderColor=ledColor;
}
function toggleSensor(){
  var hand = document.getElementById('hand');
  hand.style.display='block';
  setTimeout(function(){ hand.style.display='none'; },600);
  try{
    var ctx = new (window.AudioContext||window.webkitAudioContext)();
    var o = ctx.createOscillator(); var g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value=1200; g.gain.value=0.1; o.start(); o.stop(ctx.currentTime+0.08);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(50);
  isOn = !isOn;
  var dot = document.getElementById('sensorDot');
  if(isOn){ dot.style.background='#00ff00'; dot.style.boxShadow='0 0 10px #00ff00'; document.getElementById('status').innerText='💡 Light: ON hai'; }
  else{ dot.style.background='#ff0000'; dot.style.boxShadow='0 0 10px #ff0000'; document.getElementById('status').innerText='🌑 Light: OFF hai - Dobara Haath Hilao'; }
  updateLED();
}
function toggleNight(){
  isNight = !isNight;
  var room = document.getElementById('room');
  if(isNight){ room.style.filter='brightness(0.35)'; }
  else{ room.style.filter='brightness(1)'; }
}
updateLED();
</script>
</body>
</html>
